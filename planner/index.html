<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chiefs Planner">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Chiefs Planner</title>
  <script>
    // Apply the saved theme before first paint (no dark flash on the light theme).
    (function () {
      try {
        var c = localStorage.getItem('planner.theme') || 'auto';
        var light = c === 'light' || (c === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f4f0');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>Chiefs Planner needs JavaScript.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
