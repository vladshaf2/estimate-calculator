  /* ================= Render & navigation ================= */
  function render() {
    $$('#nav button').forEach(function (b) { b.classList.toggle('active', b.dataset.nav === (ui.view === 'client' ? 'estimate' : ui.view)); });
    $('#brand-logo').textContent = settings.studio.logo || 'Studio';
    var y = window.scrollY;
    if (ui.view === 'saved') app.innerHTML = renderSaved();
    else if (ui.view === 'settings') app.innerHTML = renderSettings();
    else if (ui.view === 'client') app.innerHTML = renderClient();
    else app.innerHTML = renderEstimate();
    window.scrollTo(0, y);
  }
  function go(view) {
    if (view === 'estimate') freshenPristine();
    if (ui.view !== view) { ui.view = view; saveUi(); render(); window.scrollTo(0, 0); }
    else render();
  }

  /* ---------------- Estimate actions ---------------- */
  function loadEstimate(e) {
    est = E.clone(e);
    baseJson = JSON.stringify(est);
    saveDraft();
  }
  async function guardDiscard() {
    if (!isDirty()) return true;
    return confirmDialog('Discard changes?', 'The current estimate has unsaved changes. Continue without saving?', 'Discard', true);
  }
  async function saveCurrent() {
    if (!String(est.name || '').trim()) {
      var n = await promptDialog('Save estimate', 'Project name', '', 'Save');
      if (!n) return;
      est.name = n;
    }
    var idx = estimates.findIndex(function (x) { return x.id === est.id; });
    if (idx < 0) {
      var same = estimates.find(function (x) { return x.name.trim().toLowerCase() === est.name.trim().toLowerCase(); });
      if (same) {
        var choice = await new Promise(function (resolve) {
          openModal({ title: 'Project name already exists', body: '<div>A saved estimate called “' + esc(same.name) + '” already exists.</div>', onCancel: function () { resolve(null); }, actions: [
            { label: 'Cancel', kind: 'ghost', onClick: function () { resolve(null); } },
            { label: 'Keep both', onClick: function () { resolve('both'); } },
            { label: 'Overwrite', kind: 'primary', onClick: function () { resolve('overwrite'); } }
          ] });
        });
        if (!choice) return;
        if (choice === 'overwrite') { est.id = same.id; est.createdAt = same.createdAt; idx = estimates.indexOf(same); }
      }
    }
    est.updatedAt = new Date().toISOString();
    if (idx >= 0) estimates[idx] = E.clone(est); else estimates.unshift(E.clone(est));
    saveEstimates();
    baseJson = JSON.stringify(est);
    saveDraft();
    toast('Saved “' + est.name + '”');
    render();
  }
  function doRefreshPrices() {
    var r = E.refreshPrices(est, settings);
    if (!r.changes.length) { toast('All prices already match your settings'); return; }
    var before = E.calcEstimate(est).total, after = E.calcEstimate(r.estimate).total;
    openModal({ title: 'Refresh prices from Settings', body:
      '<div>These snapshot values will be updated to your current settings:</div><ul>' + r.changes.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' +
      '<div>Client total: <b style="color:var(--text)">' + money(before) + '</b> → <b style="color:var(--accent)">' + money(after) + '</b></div>',
      actions: [{ label: 'Cancel', kind: 'ghost' }, { label: 'Refresh prices', kind: 'primary', onClick: function () {
        est = r.estimate; saveDraft(); render(); toast('Prices refreshed');
      } }] });
  }

  /* ---------------- Settings actions ---------------- */
  function editModel(id) {
    var m = id ? E.clone(E.findModel(settings, id)) : { id: null, name: '', category: 'Video', credits: 0, perSecond: false, notes: '', archived: false };
    if (!m) return;
    var body = field('Name', '<input type="text" id="mm-name" value="' + esc(m.name) + '" placeholder="e.g. Veo 3">') +
      '<div class="grid">' + field('Category', selectEl('id="mm-cat"', E.CATEGORIES.map(function (c) { return { value: c, label: c }; }), m.category)) +
      field('Cost in credits', '<input type="text" inputmode="decimal" id="mm-credits" value="' + esc(m.credits) + '">') + '</div>' +
      '<label class="check"><input type="checkbox" id="mm-ps"' + (m.perSecond ? ' checked' : '') + '> Price is per second of video (credits × duration × generations)</label>' +
      field('Notes', '<textarea id="mm-notes" placeholder="Resolution, mode, plan…">' + esc(m.notes) + '</textarea>') +
      (id ? '<div class="hint">Changing the price affects new lines only. Existing estimates keep their snapshot until you press “Refresh prices” in that estimate.</div>' : '');
    openModal({ title: id ? 'Edit model' : 'Add model', body: body, actions: [{ label: 'Cancel', kind: 'ghost' }, { label: id ? 'Save' : 'Add model', kind: 'primary', onClick: function (root) {
      var name = root.querySelector('#mm-name').value.trim();
      if (!name) { root.querySelector('#mm-name').focus(); return false; }
      var data = { name: name, category: root.querySelector('#mm-cat').value, credits: E.num(root.querySelector('#mm-credits').value), perSecond: root.querySelector('#mm-ps').checked, notes: root.querySelector('#mm-notes').value };
      if (id) Object.assign(E.findModel(settings, id), data);
      else settings.models.push(Object.assign({ id: E.uid('m'), archived: false }, data));
      saveSettings(); render(); toast(id ? 'Model updated' : 'Model added');
    } }] });
  }

  function exportData() {
    var go = function () {
      var data = { app: 'ai-estimate-calculator', schema: 1, exportedAt: new Date().toISOString(), settings: settings, estimates: estimates };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'estimates-backup-' + E.today() + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('Exported ' + estimates.length + ' estimate' + (estimates.length === 1 ? '' : 's') + ' + settings');
    };
    if (isDirty()) {
      confirmDialog('Unsaved estimate', 'The estimate you are editing has unsaved changes and will not be included. Export anyway?', 'Export').then(function (ok) { if (ok) go(); });
    } else go();
  }
  function importData(text) {
    var data;
    try { data = JSON.parse(text); } catch (e) { toast('Not a valid JSON file', 'error'); return; }
    if (!data || typeof data !== 'object' || (!data.settings && !Array.isArray(data.estimates))) { toast('This file is not an estimate-calculator backup', 'error'); return; }
    var inEst = Array.isArray(data.estimates) ? data.estimates.map(E.normalizeEstimate) : [];
    var inSet = data.settings ? E.normalizeSettings(data.settings) : null;
    openModal({ title: 'Import data', body: '<div>File contains <b style="color:var(--text)">' + inEst.length + ' estimate' + (inEst.length === 1 ? '' : 's') + '</b>' + (inSet ? ' and settings with <b style="color:var(--text)">' + inSet.models.length + ' models</b>' : '') + '.</div>' +
      '<ul><li><b>Merge</b> — keep your settings, add missing models, add estimates (same estimate → newer version wins).</li><li><b>Replace all</b> — overwrite settings and saved estimates on this device.</li></ul>',
      actions: [{ label: 'Cancel', kind: 'ghost' },
        { label: 'Merge', onClick: function () {
          if (inSet) inSet.models.forEach(function (m) { if (!E.findModel(settings, m.id)) settings.models.push(m); });
          var added = 0;
          inEst.forEach(function (e) {
            var i = estimates.findIndex(function (x) { return x.id === e.id; });
            if (i < 0) { estimates.push(e); added++; } else if (String(e.updatedAt) > String(estimates[i].updatedAt)) { estimates[i] = e; added++; }
          });
          saveSettings(); saveEstimates(); render(); toast('Merged · ' + added + ' estimate' + (added === 1 ? '' : 's') + ' added/updated');
        } },
        { label: 'Replace all', kind: 'danger solid primary', onClick: function () {
          if (inSet) settings = inSet;
          estimates = inEst;
          saveSettings(); saveEstimates(); render(); toast('Data replaced from backup');
        } }] });
  }

  /* ---------------- Events ---------------- */
  document.getElementById('nav').addEventListener('click', function (e) {
    var b = e.target.closest('[data-nav]'); if (b) go(b.dataset.nav);
  });
  document.getElementById('import-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { importData(String(r.result)); };
    r.readAsText(f); e.target.value = '';
  });

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.type === 'checkbox' || t.tagName === 'SELECT') return; // handled on change
    if (t.dataset.bind) { setPath(est, t.dataset.bind, readVal(t)); saveDraft(); updateDerived(); }
    else if (t.dataset.sbind) { setPath(settings, t.dataset.sbind, readVal(t)); saveSettings(); }
    else if (t.hasAttribute('data-search')) { ui.search = t.value; $('[data-out="saved-list"]').innerHTML = renderSavedList(); }
  });

  app.addEventListener('change', function (e) {
    var t = e.target, i = +t.dataset.i;
    if (t.dataset.actionCheck === 'toggle-archived') { ui.showArchived = t.checked; saveUi(); render(); return; }
    if (t.dataset.change) {
      var v = t.value;
      if (t.dataset.change === 'line-category') {
        var l = est.lines[i]; l.category = v;
        if (v === 'Video' && !E.num(l.duration)) l.duration = 5;
        E.setLineModel(l, settings, (E.activeModels(settings, v)[0] || {}).id || 'custom');
      } else if (t.dataset.change === 'line-model') {
        E.setLineModel(est.lines[i], settings, v);
      } else if (t.dataset.change === 'usage-option') {
        if (v === 'custom') est.usage = { optionId: 'custom', name: 'Custom', type: est.usage.type, value: est.usage.value };
        else { var u = settings.usageOptions.find(function (x) { return x.id === v; }); if (u) est.usage = { optionId: u.id, name: u.name, type: u.type, value: E.num(u.value) }; }
      } else if (t.dataset.change === 'rush-option') {
        if (v === 'custom') est.rush = { optionId: 'custom', name: 'Custom', pct: est.rush.pct };
        else { var r = settings.rushOptions.find(function (x) { return x.id === v; }); if (r) est.rush = { optionId: r.id, name: r.name, pct: E.num(r.pct) }; }
      }
      saveDraft(); render(); return;
    }
    if (t.tagName === 'SELECT' || t.type === 'checkbox') {
      if (t.dataset.bind) { setPath(est, t.dataset.bind, readVal(t)); saveDraft(); }
      else if (t.dataset.sbind) { setPath(settings, t.dataset.sbind, readVal(t)); saveSettings(); }
      if (t.hasAttribute('data-rerender')) render(); else if (t.dataset.bind) updateDerived();
    }
  });

  app.addEventListener('click', async function (e) {
    var b = e.target.closest('[data-action]');
    if (!b || !app.contains(b)) return;
    var a = b.dataset.action, i = +b.dataset.i, id = b.dataset.id;
    switch (a) {
      case 'set':
        setPath(b.dataset.scope === 'settings' ? settings : est, b.dataset.path, b.dataset.value);
        if (b.dataset.scope === 'settings') saveSettings(); else saveDraft();
        render(); break;
      case 'new':
        if (!(await guardDiscard())) return;
        est = E.newEstimate(settings); baseJson = JSON.stringify(est); saveDraft(); go('estimate'); window.scrollTo(0, 0); break;
      case 'save': await saveCurrent(); break;
      case 'duplicate-current':
        est = E.duplicateEstimate(est); baseJson = ''; saveDraft(); render(); toast('Duplicated — this copy is not saved yet'); break;
      case 'refresh-prices': doRefreshPrices(); break;
      case 'client': go('client'); window.scrollTo(0, 0); break;
      case 'back': go('estimate'); break;
      case 'print': window.print(); break;
      case 'scroll-summary': var s = $('#summary'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'add-line': {
        var last = est.lines[est.lines.length - 1];
        est.lines.push(E.makeLine(settings, b.dataset.cat || (last && last.category) || 'Video'));
        saveDraft(); render();
        var ins = $$('.line .line-top input', app); if (ins.length) ins[ins.length - 1].focus({ preventScroll: true });
        break;
      }
      case 'line-dup': { var cp = E.clone(est.lines[i]); cp.id = E.uid('l'); est.lines.splice(i + 1, 0, cp); saveDraft(); render(); break; }
      case 'line-del': est.lines.splice(i, 1); saveDraft(); render(); break;
      case 'add-service': est.services.push(E.newCustomService(settings)); saveDraft(); render(); break;
      case 'svc-del': est.services.splice(i, 1); saveDraft(); render(); break;
      case 'add-fixed': est.fixedCosts.push({ id: E.uid('f'), name: '', amount: 0 }); saveDraft(); render();
        var fi = $$('.rows .row input', app); if (fi.length >= 2) fi[fi.length - 2].focus({ preventScroll: true }); break;
      case 'fixed-del': est.fixedCosts.splice(i, 1); saveDraft(); render(); break;

      case 'open': {
        if (id === est.id && !isDirty()) { go('estimate'); break; }
        if (!(await guardDiscard())) return;
        var found = estimates.find(function (x) { return x.id === id; });
        if (found) { loadEstimate(found); go('estimate'); window.scrollTo(0, 0); }
        break;
      }
      case 'dup-saved': {
        var src = estimates.find(function (x) { return x.id === id; });
        if (src) { var d = E.duplicateEstimate(src); estimates.unshift(d); saveEstimates(); render(); toast('Duplicated as “' + d.name + '”'); }
        break;
      }
      case 'del-saved': {
        var del = estimates.find(function (x) { return x.id === id; });
        if (del && await confirmDialog('Delete estimate?', 'Delete “' + esc(del.name || 'Untitled') + '” permanently? This cannot be undone.', 'Delete', true)) {
          estimates = estimates.filter(function (x) { return x.id !== id; }); saveEstimates(); render(); toast('Deleted');
        }
        break;
      }
      case 'export': exportData(); break;
      case 'import': $('#import-file').click(); break;

      case 'model-add': editModel(null); break;
      case 'model-edit': editModel(id); break;
      case 'model-archive': E.findModel(settings, id).archived = true; saveSettings(); render(); toast('Archived — hidden from selection'); break;
      case 'model-restore': E.findModel(settings, id).archived = false; saveSettings(); render(); toast('Restored'); break;
      case 'model-delete': {
        var m = E.findModel(settings, id);
        if (modelUsage(id)) { toast('Model is used in an estimate — archive it instead', 'error'); break; }
        if (await confirmDialog('Delete model?', 'Delete “' + esc(m.name) + '”? It is not used in any estimate.', 'Delete', true)) {
          settings.models = settings.models.filter(function (x) { return x.id !== id; }); saveSettings(); render();
        }
        break;
      }
      case 'rush-add': settings.rushOptions.push({ id: E.uid('r'), name: '', pct: 0 }); saveSettings(); render(); break;
      case 'rush-del': settings.rushOptions.splice(i, 1); saveSettings(); render(); break;
      case 'usage-add': settings.usageOptions.push({ id: E.uid('u'), name: '', type: 'mult', value: 1 }); saveSettings(); render(); break;
      case 'usage-del': settings.usageOptions.splice(i, 1); saveSettings(); render(); break;
      case 'reset-settings':
        if (await confirmDialog('Reset settings?', 'Restore all settings (models, rates, options, studio details) to defaults? Saved estimates are not affected.', 'Reset', true)) {
          settings = E.defaultSettings(); saveSettings(); render(); toast('Settings reset');
        }
        break;
      case 'wipe':
        if (await confirmDialog('Delete all data?', 'This permanently deletes all settings and saved estimates from this browser. Export a backup first if you need it.', 'Delete everything', true)) {
          Object.keys(KEYS).forEach(function (k) { try { localStorage.removeItem(KEYS[k]); } catch (err) { /* ignore */ } });
          location.reload();
        }
        break;
    }
  });

  // Keep data in sync if the app is open in two tabs.
  window.addEventListener('storage', function (e) {
    if (e.key === KEYS.settings) { settings = E.normalizeSettings(load(KEYS.settings, null)); if (ui.view !== 'estimate') render(); }
    if (e.key === KEYS.estimates) { estimates = (load(KEYS.estimates, []) || []).map(E.normalizeEstimate); if (ui.view === 'saved') render(); }
  });

  if (ui.view === 'estimate') freshenPristine();
  render();
})();
</script>
</body>
</html>
