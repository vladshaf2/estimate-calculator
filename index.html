* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font);
  background-image: radial-gradient(1200px 600px at 80% -10%, rgba(233,181,74,.06), transparent 60%),
                    radial-gradient(900px 500px at -10% 110%, rgba(120,120,255,.035), transparent 60%);
  background-attachment: fixed; min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
.num, .tab { font-variant-numeric: tabular-nums; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; height: 58px; display: flex; align-items: center; gap: 16px;
  padding: 0 max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--border);
  background: rgba(10,10,11,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
#brand-mark { display: flex; align-items: center; color: var(--text); }
.logo-mark { display: inline-block; height: 26px; aspect-ratio: 420 / 355; background: currentColor;
  -webkit-mask: var(--chiefs-mask) center / contain no-repeat; mask: var(--chiefs-mask) center / contain no-repeat; }
.brand .logo-img { height: 30px; max-width: 120px; object-fit: contain; display: block; }
.lang-switch { display: flex; gap: 2px; border: 1px solid var(--border); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang-switch button { border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 5px 9px; border-radius: 999px; cursor: pointer; }
.lang-switch button.on { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }
.brand-logo { font-weight: 800; letter-spacing: .22em; text-transform: uppercase; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.brand-sub { color: var(--faint); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.nav { margin-left: auto; display: flex; flex: none; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.nav button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; }
.nav button:hover { color: var(--text); }
.nav button.active { background: var(--text); color: var(--bg); font-weight: 600; }

main { max-width: 1320px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left)) 120px; }

/* ---------- Generic ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; justify-content: space-between; margin-bottom: 20px; }
.page-head h1 { font-size: 28px; line-height: 1.15; word-break: break-word; }
.eyebrow { color: var(--accent); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
.status { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--accent); }
.head-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 14px;
  border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
  cursor: pointer; white-space: nowrap; font-size: 13px; transition: border-color .15s, background .15s;
}
.btn:hover { border-color: #45454d; background: #1d1d21; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: #f2c25c; }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #1a0606; font-weight: 600; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12px; }
.btn.dashed { border-style: dashed; background: transparent; color: var(--muted); }
.btn.dashed:hover { color: var(--text); border-color: var(--accent); }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--faint); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }

  function mergeDefaults(def, val) {

  /* ---------------- Settings ---------------- */
  function defaultSettings() {
    function m(id, name, category) { return { id: id, name: name, category: category, credits: 0, perSecond: false, notes: '', archived: false }; }

      schema: 1,

  function normalizeSettings(s) {

    });

    if (LANGS.indexOf(out.defaultDocLang) < 0) out.defaultDocLang = 'en';

  }

  function findModel(settings, id) {
    var list = (settings && settings.models) || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function activeModels(settings, category) {
    return ((settings && settings.models) || []).filter(function (m) { return !m.archived && m.category === category; });
  }
  function serviceRate(settings, key) {
    var r = settings.serviceRates ? settings.serviceRates[key] : null;
    return (r === null || r === undefined || r === '') ? num(settings.hourlyRate) : num(r);
  }

  /* ---------------- Estimate ---------------- */
  var LINE_DEFAULT = { id: '', label: '', category: 'Video', modelId: 'custom', modelName: '', credits: 0, perSecond: false, gens: 1, duration: 0 };
  var SERVICE_DEFAULT = { id: '', key: '', name: '', desc: '', enabled: false, mode: 'hours', hours: 0, rate: 0, fixed: 0, custom: false };

  function newService(settings, def) {
    return { id: uid('s'), key: def.key, name: def.name, desc: def.desc, enabled: false, mode: 'hours', hours: 0, rate: serviceRate(settings, def.key), fixed: 0, custom: false };
  }
  function newCustomService(settings) {
    return { id: uid('s'), key: '', name: '', desc: '', enabled: true, mode: 'hours', hours: 0, rate: num(settings.hourlyRate), fixed: 0, custom: true };
  }

  function newEstimate(settings) {
    settings = settings || defaultSettings();
    var now = new Date().toISOString();
    var rush = settings.rushOptions[0] || { id: 'custom', name: 'Standard', pct: 0 };
    var usage = settings.usageOptions[0] || { id: 'custom', name: 'Custom', type: 'mult', value: 1 };
    return {
      id: uid('e'), createdAt: now, updatedAt: now,
      name: '', client: '', date: today(), deadline: '', currency: settings.defaultCurrency || 'USD',
      docLang: LANGS.indexOf(settings.defaultDocLang) >= 0 ? settings.defaultDocLang : 'en',
      rates: { creditPrice: num(settings.creditPrice), EUR: num(settings.fx.EUR), CZK: num(settings.fx.CZK) },
      wastePct: num(settings.wastePct),
      lines: [],
      services: SERVICE_DEFS.map(function (d) { return newService(settings, d); }),
      formats: { enabled: false, label: '9:16, 1:1', count: 0, price: num(settings.formatPrice) },
      fixedCosts: [],
      revisions: { included: num(settings.revisionsIncluded), extra: 0, price: num(settings.revisionPrice) },
      usage: { optionId: usage.id, name: usage.name, type: usage.type, value: num(usage.value) },
      rush: { optionId: rush.id, name: rush.name, pct: num(rush.pct) },
      discount: { type: 'pct', value: 0 },
      markup: { pct: num(settings.markupPct), credits: !!settings.markupOn.credits, labor: !!settings.markupOn.labor, fixed: !!settings.markupOn.fixed },
      prepayPct: num(settings.prepayPct),
      clientNotes: '', internalNotes: ''
    };
  }

  function normalizeEstimate(e) {
    var d = newEstimate(defaultSettings());
    if (!isObj(e)) return d;
    var out = mergeDefaults(d, e);
    out.lines = Array.isArray(e.lines) ? e.lines.filter(isObj).map(function (l) { var x = mergeDefaults(LINE_DEFAULT, l); if (!x.id) x.id = uid('l'); return x; }) : [];
    out.services = Array.isArray(e.services) ? e.services.filter(isObj).map(function (s) { var x = mergeDefaults(SERVICE_DEFAULT, s); if (!x.id) x.id = uid('s'); return x; }) : d.services;
    out.fixedCosts = Array.isArray(e.fixedCosts) ? e.fixedCosts.filter(isObj).map(function (f) { return { id: f.id || uid('f'), name: String(f.name == null ? '' : f.name), amount: num(f.amount) }; }) : [];
    if (CURRENCIES.indexOf(out.currency) < 0) out.currency = 'USD';
    if (LANGS.indexOf(out.docLang) < 0) out.docLang = 'en';
    if (!out.id) out.id = uid('e');

  }

  function applyModel(line, model) {
    line.modelId = model.id;
    line.modelName = model.name;
    line.credits = num(model.credits);
    line.perSecond = !!model.perSecond;
  }
  /** Creates a generation line with a snapshot of the model's current name & price. */
  function makeLine(settings, category, modelId) {
    var line = clone(LINE_DEFAULT);
    line.id = uid('l');
    line.category = category || 'Video';
    line.duration = line.category === 'Video' ? 5 : 0;
    setLineModel(line, settings, modelId || ((activeModels(settings, line.category)[0] || {}).id) || 'custom');
    return line;
  }
  function setLineModel(line, settings, modelId) {
    if (modelId === 'custom' || !findModel(settings, modelId)) {

  }
  function lineCredits(l) {

    return l.perSecond ? c * num(l.duration) * g : c * g;
  }
  function serviceAmountUSD(s) {
    return s.mode === 'fixed' ? num(s.fixed) : num(s.hours) * num(s.rate);
  }

  /**
   * Re-snapshot prices from current settings (models, credit price, FX, hourly rates,
   * format & revision prices). Returns a NEW estimate plus a list of changes:
   *   { type: 'model'|'creditPrice'|'fxEUR'|'fxCZK'|'rate'|'formatPrice'|'revisionPrice', name?, key?, from, to, perSecond?, newName? }
   */
  function refreshPrices(est, settings) {
    var e = clone(est), changes = [], seen = {};
    function note(c) { var k = JSON.stringify(c); if (!seen[k]) { seen[k] = 1; changes.push(c); } }
    (e.lines || []).forEach(function (l) {
      if (l.modelId === 'custom') return;
      var m = findModel(settings, l.modelId);
      if (!m) return;
      if (l.modelName !== m.name || num(l.credits) !== num(m.credits) || !!l.perSecond !== !!m.perSecond) {
        note({ type: 'model', name: l.modelName || m.name, from: num(l.credits), to: num(m.credits), perSecond: !!m.perSecond, newName: l.modelName !== m.name ? m.name : '' });
        applyModel(l, m);
      }
    });
    var r = e.rates || (e.rates = {});
    [['creditPrice', num(settings.creditPrice), 'creditPrice'], ['EUR', num(settings.fx.EUR), 'fxEUR'], ['CZK', num(settings.fx.CZK), 'fxCZK']].forEach(function (x) {
      if (num(r[x[0]]) !== x[1]) { note({ type: x[2], from: num(r[x[0]]), to: x[1] }); r[x[0]] = x[1]; }
    });
    (e.services || []).forEach(function (s) {
      if (s.custom || !s.key) return;
      var rate = serviceRate(settings, s.key);
      if (num(s.rate) !== rate) { note({ type: 'rate', key: s.key, name: s.name, from: num(s.rate), to: rate }); s.rate = rate; }
    });
    if (e.formats && num(e.formats.price) !== num(settings.formatPrice)) { note({ type: 'formatPrice', from: num(e.formats.price), to: num(settings.formatPrice) }); e.formats.price = num(settings.formatPrice); }
    if (e.revisions && num(e.revisions.price) !== num(settings.revisionPrice)) { note({ type: 'revisionPrice', from: num(e.revisions.price), to: num(settings.revisionPrice) }); e.revisions.price = num(settings.revisionPrice); }
    return { estimate: e, changes: changes };
  }

  function duplicateEstimate(est, suffix) {
    var e = clone(est), now = new Date().toISOString();
    e.id = uid('e'); e.createdAt = now; e.updatedAt = now;
    e.name = (e.name || 'Untitled') + (suffix == null ? ' (copy)' : suffix);
    return e;
  }

  function modelUsageCount(modelId, estimates) {
    return (estimates || []).filter(function (e) { return (e.lines || []).some(function (l) { return l.modelId === modelId; }); }).length;
  }

  /**
   * Full calculation. All inputs are in USD; all outputs are in the estimate's currency.
   *
   *   AI cost      = credits × creditPrice; waste = AI cost × waste%
   *   Labor        = services + extra formats + extra revision rounds
   *   Markup       = markup% × (selected of: AI cost incl. waste, labor, fixed costs)
   *   Subtotal     = AI + labor + fixed + markup         (sum of rounded client lines)
   *   Rush fee     = rush% × (labor + markup)            (never on raw credit / fixed costs)
   *   Usage rights = subtotal × (multiplier − 1)  or a fixed surcharge
   *   Discount     = % of (subtotal + rush + usage)  or a fixed amount
   *   Total        = subtotal + rush + usage − discount;  Prepayment = total × prepay%
   *   Real cost    = AI cost incl. waste + fixed costs;  Margin = total − real cost
   */
  function calcEstimate(est) {
    est = est || {};
    var currency = CURRENCIES.indexOf(est.currency) >= 0 ? est.currency : 'USD';
    var dp = currencyDp(currency);
    var rates = est.rates || {};
    var fx = currency === 'USD' ? 1 : num(rates[currency]);
    var cp = num(rates.creditPrice);
    var R = function (x) { return roundTo(x, dp); };
    var cv = function (usd) { return usd * fx; };
    var sum = function (arr, k) { return arr.reduce(function (a, x) { return a + x[k]; }, 0); };
    var warnings = [];
    if (currency !== 'USD' && fx <= 0) warnings.push({ code: 'fx', currency: currency });

    // --- AI generation
    var cats = {};
    CATEGORIES.forEach(function (c) { cats[c] = { credits: 0, lines: 0 }; });
    var rawCredits = 0;
    var lines = (est.lines || []).map(function (l) {
      var credits = lineCredits(l);
      var cat = cats[l.category] ? l.category : 'Other';
      cats[cat].credits += credits; cats[cat].lines += 1;
      rawCredits += credits;
      return { id: l.id, credits: credits, cost: cv(credits * cp) };
    });
    var wastePct = num(est.wastePct);
    var wasteCredits = rawCredits * wastePct / 100;
    var totalCredits = rawCredits + wasteCredits;
    var creditsCost = cv(rawCredits * cp);
    var wasteCost = cv(wasteCredits * cp);
    var genCost = creditsCost + wasteCost;
    var categories = CATEGORIES.filter(function (c) { return cats[c].lines > 0; }).map(function (c) {
      return { category: c, credits: cats[c].credits, lines: cats[c].lines, cost: cv(cats[c].credits * cp) };
    });
    if (rawCredits > 0 && cp <= 0) warnings.push({ code: 'creditPrice' });

    // --- Labor
    var services = (est.services || []).map(function (s) {
      return { id: s.id, key: s.custom ? '' : String(s.key || ''), name: String(s.name || '').trim(), desc: String(s.desc || ''), enabled: !!s.enabled, mode: s.mode === 'fixed' ? 'fixed' : 'hours', hours: num(s.hours), rate: cv(num(s.rate)), amount: cv(serviceAmountUSD(s)) };
    });
    var laborItems = services.filter(function (s) { return s.enabled; }).map(function (s) {
      return { kind: 'service', key: s.key, name: s.name, desc: s.desc, mode: s.mode, hours: s.hours, rate: s.rate, amount: s.amount };
    });
    var fm = est.formats || {};
    var formats = fm.enabled ? cv(num(fm.count) * num(fm.price)) : 0;
    if (fm.enabled) laborItems.push({ kind: 'formats', desc: String(fm.label || ''), count: num(fm.count), price: cv(num(fm.price)), amount: formats });
    var rv = est.revisions || {};
    var revisions = cv(num(rv.extra) * num(rv.price));
    if (num(rv.extra) > 0) laborItems.push({ kind: 'revisions', count: num(rv.extra), price: cv(num(rv.price)), amount: revisions });
    var labor = sum(laborItems, 'amount');

    // --- Fixed costs
    var fixedItems = (est.fixedCosts || []).map(function (f) {
      return { id: f.id, name: String(f.name || '').trim(), amount: cv(num(f.amount)) };
    });
    var fixed = sum(fixedItems, 'amount');

    // --- Markup (hidden from client: folded into the line items it applies to)
    var mk = est.markup || {};
    var markupPct = num(mk.pct);
    var mC = mk.credits ? markupPct / 100 : 0, mL = mk.labor ? markupPct / 100 : 0, mF = mk.fixed ? markupPct / 100 : 0;
    var markupBase = (mk.credits ? genCost : 0) + (mk.labor ? labor : 0) + (mk.fixed ? fixed : 0);
    var markupRaw = genCost * mC + labor * mL + fixed * mF;

    // --- Client lines (rounded to currency precision; the subtotal is their exact sum).
    // Language-neutral: the UI turns kind/key/name/desc/count into English or Russian text.
    var clientLines = [];
    if (genCost !== 0) clientLines.push({ section: 'ai', kind: 'ai', cats: categories.filter(function (x) { return x.credits > 0; }).map(function (x) { return x.category; }), amount: R(genCost * (1 + mC)) });
    laborItems.forEach(function (it) {
      var amt = R(it.amount * (1 + mL));
      if (amt === 0) return;
      clientLines.push({ section: it.kind === 'revisions' ? 'revisions' : 'services', kind: it.kind, key: it.key || '', name: it.name || '', desc: it.desc || '', count: it.count || 0, amount: amt });
    });
    fixedItems.forEach(function (f) {
      var amt = R(f.amount * (1 + mF));
      if (amt !== 0) clientLines.push({ section: 'third', kind: 'fixed', name: f.name, desc: '', amount: amt });
    });
    var subtotal = R(sum(clientLines, 'amount'));
    var markup = subtotal - genCost - labor - fixed; // effective markup incl. rounding

    // --- Rush fee: on labor + markup only
    var rs = est.rush || {};
    var rushPct = num(rs.pct);
    var rush = R((labor + markupRaw) * rushPct / 100);

    // --- Usage rights
    var us = est.usage || {};
    var usageType = us.type === 'fixed' ? 'fixed' : 'mult';
    var usageValue = num(us.value);
    var usage = usageType === 'fixed' ? R(cv(usageValue)) : (usageValue > 0 ? R(subtotal * (usageValue - 1)) : 0);

    // --- Discount
    var preDiscount = R(subtotal + rush + usage);
    var ds = est.discount || {};
    var discountType = ds.type === 'fixed' ? 'fixed' : 'pct';
    var discount = discountType === 'fixed' ? R(cv(num(ds.value))) : R(preDiscount * num(ds.value) / 100);
    discount = Math.max(0, Math.min(discount, Math.max(0, preDiscount)));

    var total = R(preDiscount - discount);
    var prepayPct = num(est.prepayPct);
    var prepay = R(total * prepayPct / 100);

    var realCost = genCost + fixed;
    var margin = total - realCost;
    var marginExLabor = margin - labor;

    return {
      currency: currency, dp: dp, fx: fx, creditPrice: cp,
      lines: lines, categories: categories,
      rawCredits: rawCredits, wastePct: wastePct, wasteCredits: wasteCredits, totalCredits: totalCredits,
      creditsCost: creditsCost, wasteCost: wasteCost, genCost: genCost,
      services: services, laborItems: laborItems, labor: labor, formats: formats, revisions: revisions,
      fixedItems: fixedItems, fixed: fixed,
      markupPct: markupPct, markupBase: markupBase, markupRaw: markupRaw, markup: markup,
      clientLines: clientLines, subtotal: subtotal,
      rushPct: rushPct, rushName: String(rs.name || ''), rush: rush,
      usageName: String(us.name || ''), usageType: usageType, usageValue: usageValue, usage: usage,
      preDiscount: preDiscount, discountType: discountType, discountValue: num(ds.value), discount: discount,
      total: total, prepayPct: prepayPct, prepay: prepay, balance: R(total - prepay),
      realCost: realCost, margin: margin, marginPct: total > 0 ? margin / total * 100 : 0,
      marginExLabor: marginExLabor, marginExLaborPct: total > 0 ? marginExLabor / total * 100 : 0,
      warnings: warnings
    };
  }

  root.Engine = {
    CATEGORIES: CATEGORIES, CURRENCIES: CURRENCIES, LANGS: LANGS, SERVICE_DEFS: SERVICE_DEFS,
    uid: uid, clone: clone, num: num, roundTo: roundTo, currencyDp: currencyDp, today: today,
    fmtMoney: fmtMoney, fmtNum: fmtNum,
    defaultSettings: defaultSettings, normalizeSettings: normalizeSettings,
    findModel: findModel, activeModels: activeModels, serviceRate: serviceRate,
    newEstimate: newEstimate, normalizeEstimate: normalizeEstimate, newCustomService: newCustomService,
    makeLine: makeLine, setLineModel: setLineModel, lineCredits: lineCredits,
    refreshPrices: refreshPrices, duplicateEstimate: duplicateEstimate, modelUsageCount: modelUsageCount,
    calcEstimate: calcEstimate
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  function tr(lang, key, vars) {
    var v = (I18N[lang] && I18N[lang][key]);
    if (v === undefined) v = I18N.en[key];
    if (v === undefined) { console.error('i18n: missing key ' + key); return key; }
    if (typeof v === 'function') return v(vars || {});
    return vars ? v.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; }) : v;
  }
  function t(key, vars) { return tr(ui.lang, key, vars); }
  function dataName(lang, id, name) {
    var d = DATA_I18N[id];
    if (d && (!name || name === d[0])) return lang === 'ru' ? d[1] : d[0];
    return name || (lang === 'ru' ? DATA_I18N.custom[1] : DATA_I18N.custom[0]);
  }
  function svcName(lang, s) {
    var x = !s.custom && s.key && SVC_I18N[s.key];
    if (x && lang === 'ru') return x.ru[0];
    return s.name || tr(lang, 'svc.unnamed');
  }
  function svcDesc(lang, s) {
    var x = !s.custom && s.key && SVC_I18N[s.key];
    if (x && lang === 'ru') return x.ru[1];
    return s.desc || '';
  }
  function catName(c) { return t('cat.' + c); }

  /* ================= State ================= */
  var settings = E.normalizeSettings(load(KEYS.settings, null));
  var estimates = (load(KEYS.estimates, []) || []).map(E.normalizeEstimate);
  var est, baseJson;
  (function initDraft() {
    var d = load(KEYS.draft, null);

    else { est = E.newEstimate(settings); baseJson = JSON.stringify(est); }
  })();
  var browserLang = (navigator.language || 'en').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
  var ui = Object.assign({ view: 'estimate', showArchived: false, search: '', lang: browserLang }, load(KEYS.ui, {}) || {});
  if (['estimate', 'saved', 'settings', 'client'].indexOf(ui.view) < 0) ui.view = 'estimate';
  if (E.LANGS.indexOf(ui.lang) < 0) ui.lang = 'en';

  function saveSettings() { store(KEYS.settings, settings); renderBrand(); }
  function saveEstimates() { store(KEYS.estimates, estimates); }
  function saveDraft() { store(KEYS.draft, { est: est, baseJson: baseJson }); }
  function saveUi() { store(KEYS.ui, { view: ui.view, showArchived: ui.showArchived, lang: ui.lang }); }
  function isSaved() { return estimates.some(function (x) { return x.id === est.id; }); }
  function isDirty() { return JSON.stringify(est) !== baseJson; }

  function freshenPristine() {

  }

  /* ================= Helpers ================= */
  function money(x, lang) { return E.fmtMoney(x, est.currency, lang || ui.lang); }
  function nf(x, dp, lang) { return E.fmtNum(x, dp, lang || ui.lang); }

  function pct(x, lang) { return nf(x, 2, lang) + '%'; }
  function fmtDate(iso, lang, long) {
    if (!iso) return '';
    var d = new Date(iso.length === 10 ? iso + 'T00:00:00' : iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString((lang || ui.lang) === 'ru' ? 'ru-RU' : 'en-GB', { day: 'numeric', month: long ? 'long' : 'short', year: 'numeric' });
  }

    o[ks[ks.length - 1]] = val;

  }

  /** Text/number input. opts: {scope, type, pre, suf, ph, cls, label, fcls, aria, html} */

    }

    function close() { root.innerHTML = ''; document.removeEventListener('keydown', onKey); }
    function onKey(e) {
      if (e.key === 'Escape') { close(); if (o.onCancel) o.onCancel(); }
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') { var p = o.actions.findIndex(function (a) { return a.kind && a.kind.indexOf('primary') >= 0; }); if (p >= 0) root.querySelector('[data-modal-act="' + p + '"]').click(); }
    }
    document.addEventListener('keydown', onKey);
    root.querySelector('.modal-backdrop').addEventListener('mousedown', function (e) { if (e.target.classList.contains('modal-backdrop')) { close(); if (o.onCancel) o.onCancel(); } });
    $$('[data-modal-act]', root).forEach(function (b) {
      b.addEventListener('click', function () {
        var a = o.actions[+b.dataset.modalAct];
        var r = a.onClick ? a.onClick(root) : undefined;
        if (r !== false) close();
      });
    });
    var f = root.querySelector('input, select, textarea') || root.querySelector('.btn.primary');
    if (f) setTimeout(function () { f.focus(); if (f.select) f.select(); }, 30);
  }
  function confirmDialog(title, message, okLabel, danger) {

      openModal({ title: title, body: '<div>' + message + '</div>', onCancel: function () { resolve(false); }, actions: [
        { label: t('m.cancel'), kind: 'ghost', onClick: function () { resolve(false); } },
        { label: okLabel || t('m.ok'), kind: danger ? 'danger solid primary' : 'primary', onClick: function () { resolve(true); } }
      ] });
    });
  }
  function promptDialog(title, label, value, okLabel) {

        { label: okLabel || t('m.ok'), kind: 'primary', onClick: function (root) {

      : nf(c, 4) + ' ' + t('u.cr') + ' × ' + nf(g) + ' ' + t('u.gen');
  }

  function outputs(c) {

  /* ================= CLIENT DOCUMENT ================= */
  function aiDetail(lang, cats) {
    var has = function (c) { return cats.indexOf(c) >= 0; };
    var kinds = [];
    if (lang === 'ru') {
      if (has('Video')) kinds.push('видео');
      if (has('Image')) kinds.push('изображений');
      if (has('Audio')) kinds.push('аудио');
      if (has('Other')) kinds.push('дополнительных материалов');
      return (kinds.length ? 'Генерация ' + joinAnd('ru', kinds) + ' с помощью ИИ' : 'AI-генерация') + ', включая итерации' + (has('Upscale') ? ' и апскейл' : '');
    }
    if (has('Video')) kinds.push('video');
    if (has('Image')) kinds.push('images');
    if (has('Audio')) kinds.push('audio');
    if (has('Other')) kinds.push('additional assets');
    return (kinds.length ? 'AI-generated ' + joinAnd('en', kinds) : 'AI generation') + ', incl. ' + joinAnd('en', has('Upscale') ? ['iterations', 'upscaling'] : ['iterations']);
  }
  function clientLineText(lang, l) {
    switch (l.kind) {
      case 'ai': return { name: tr(lang, 'doc.ai'), detail: aiDetail(lang, l.cats || []) };
      case 'service': return { name: svcName(lang, l), detail: svcDesc(lang, l) };
      case 'formats':
        return { name: tr(lang, 'doc.formats'), detail: lang === 'ru'
          ? l.count + ' ' + plural('ru', l.count, ['дополнительный формат', 'дополнительных формата', 'дополнительных форматов']) + (l.desc ? ' (' + l.desc + ')' : '')
          : l.count + ' additional format' + (l.count === 1 ? '' : 's') + (l.desc ? ' (' + l.desc + ')' : '') };
      case 'revisions':
        return { name: tr(lang, 'doc.revisions'), detail: lang === 'ru'
          ? l.count + ' ' + plural('ru', l.count, ['раунд', 'раунда', 'раундов']) + ' сверх включённых'
          : l.count + ' round' + (l.count === 1 ? '' : 's') + ' beyond the included revisions' };
      default: return { name: l.name || tr(lang, 'doc.fixed'), detail: '' };
    }
  }
  function revisionTerms(lang, inc, extra) {
    if (lang === 'ru') {
      var s = inc ? 'включено ' + inc + ' ' + plural('ru', inc, ['раунд', 'раунда', 'раундов']) + ' правок' : 'раунды правок не включены';
      if (extra > 0) s += '; ' + extra + ' ' + plural('ru', extra, ['дополнительный раунд учтён', 'дополнительных раунда учтены', 'дополнительных раундов учтены']) + ' выше';
      return s.charAt(0).toUpperCase() + s.slice(1) + '.';
    }
    var e = inc ? inc + ' revision round' + (inc === 1 ? '' : 's') + ' included' : 'No revision rounds included';
    if (extra > 0) e += '; ' + extra + ' additional round' + (extra === 1 ? '' : 's') + ' priced above';
    return e + '.';
  }
  function timelineTerms(lang, rushName, deadline) {
    if (lang === 'ru') return 'Срочное производство' + (rushName ? ' (' + rushName + ')' : '') + (deadline ? ', сдача до ' + deadline : '') + '.';
    return (rushName ? rushName + ' delivery' : 'Rush delivery') + (deadline ? ' by ' + deadline : '') + '.';
  }

    var meta = [[T('doc.client'), est.client], [T('doc.date'), fmtDate(est.date, L, true)], [T('doc.deadline'), fmtDate(est.deadline, L, true)], [T('doc.currency'), est.currency]].filter(function (x) { return x[1]; });

    h += '<article class="doc" lang="' + L + '"><header class="doc-head"><div class="doc-brand">' + docLogo() + (tagline ? '<div class="doc-tagline">' + esc(tagline) + '</div>' : '') + '</div>' +

    h += '<table class="doc-table"><tbody>';

    groups.forEach(function (g) {

      });

    h += '</tbody></table><div class="doc-totals">';

    h += trow(T('doc.subtotal'), dm(c.subtotal));

    h += '<div><b>' + T('doc.usageTerms') + '</b> ' + esc(usageName) + (c.usage ? '' : ' ' + T('doc.included')) + '.</div>';
    if (c.rush) h += '<div><b>' + T('doc.timelineTitle') + '</b> ' + esc(timelineTerms(L, rushName, fmtDate(est.deadline, L, true))) + '</div>';
    if (est.clientNotes && est.clientNotes.trim()) h += '<div class="doc-notes">' + esc(est.clientNotes.trim()) + '</div>';

  function render() {
    document.documentElement.lang = ui.lang;
    $$('#nav button').forEach(function (b) { b.classList.toggle('active', b.dataset.nav === (ui.view === 'client' ? 'estimate' : ui.view)); b.textContent = t('nav.' + b.dataset.nav); });
    $$('#lang-switch button').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === ui.lang); });
    renderBrand();
    var y = window.scrollY;
    if (ui.view === 'saved') app.innerHTML = renderSaved();
    else if (ui.view === 'settings') app.innerHTML = renderSettings();
    else if (ui.view === 'client') app.innerHTML = renderClient();
    else app.innerHTML = renderEstimate();
    window.scrollTo(0, y);
  }
  function go(view) {
    if (view === 'estimate') freshenPristine();
    if (ui.view !== view) { ui.view = view; saveUi(); render(); window.scrollTo(0, 0); }
    else render();
  }

  /* ================= Estimate actions ================= */
  function loadEstimate(e) {
    est = E.clone(e);
    baseJson = JSON.stringify(est);
    saveDraft();
  }
  async function guardDiscard() {
    if (!isDirty()) return true;
    return confirmDialog(t('m.discardTitle'), esc(t('m.discardMsg')), t('m.discard'), true);
  }
  async function saveCurrent() {
    if (!String(est.name || '').trim()) {
      var n = await promptDialog(t('m.saveTitle'), t('m.projectName'), '', t('btn.save'));
      if (!n) return;
      est.name = n;
    }
    var idx = estimates.findIndex(function (x) { return x.id === est.id; });
    if (idx < 0) {
      var same = estimates.find(function (x) { return x.name.trim().toLowerCase() === est.name.trim().toLowerCase(); });
      if (same) {
        var choice = await new Promise(function (resolve) {
          openModal({ title: t('m.existsTitle'), body: '<div>' + esc(t('m.existsMsg', { n: same.name })) + '</div>', onCancel: function () { resolve(null); }, actions: [
            { label: t('m.cancel'), kind: 'ghost', onClick: function () { resolve(null); } },
            { label: t('m.keepBoth'), onClick: function () { resolve('both'); } },
            { label: t('m.overwrite'), kind: 'primary', onClick: function () { resolve('overwrite'); } }
          ] });
        });
        if (!choice) return;
        if (choice === 'overwrite') { est.id = same.id; est.createdAt = same.createdAt; idx = estimates.indexOf(same); }
      }
    }
    est.updatedAt = new Date().toISOString();
    if (idx >= 0) estimates[idx] = E.clone(est); else estimates.unshift(E.clone(est));
    saveEstimates();
    baseJson = JSON.stringify(est);
    saveDraft();
    toast(t('toast.saved', { n: est.name }));
    render();
  }
  function changeText(c) {
    var arrow = function (a, b, dp, pre) { return (pre || '') + nf(a, dp) + ' → ' + (pre || '') + nf(b, dp); };
    switch (c.type) {
      case 'model': return dataName(ui.lang, '', c.name) + ': ' + arrow(c.from, c.to, 4) + ' ' + unitPer(c.perSecond) + (c.newName ? ' ' + t('change.renamed', { n: c.newName }) : '');
      case 'creditPrice': return t('change.creditPrice') + ': ' + arrow(c.from, c.to, 6, '$');
      case 'fxEUR': return t('change.fxEUR') + ': ' + arrow(c.from, c.to, 6);
      case 'fxCZK': return t('change.fxCZK') + ': ' + arrow(c.from, c.to, 6);
      case 'rate': return t('change.rate', { n: svcName(ui.lang, { key: c.key, name: c.name }) }) + ': ' + arrow(c.from, c.to, 2, '$');
      case 'formatPrice': return t('change.formatPrice') + ': ' + arrow(c.from, c.to, 2, '$');
      case 'revisionPrice': return t('change.revisionPrice') + ': ' + arrow(c.from, c.to, 2, '$');
    }
    return JSON.stringify(c);
  }
  function doRefreshPrices() {
    var r = E.refreshPrices(est, settings);
    if (!r.changes.length) { toast(t('toast.pricesOk')); return; }
    var before = E.calcEstimate(est).total, after = E.calcEstimate(r.estimate).total;
    openModal({ title: t('m.refreshTitle'), body:
      '<div>' + t('m.refreshIntro') + '</div><ul>' + r.changes.map(function (c) { return '<li>' + esc(changeText(c)) + '</li>'; }).join('') + '</ul>' +
      '<div>' + t('m.refreshTotal') + ' <b style="color:var(--text)">' + money(before) + '</b> → <b style="color:var(--accent)">' + money(after) + '</b></div>',
      actions: [{ label: t('m.cancel'), kind: 'ghost' }, { label: t('btn.refresh'), kind: 'primary', onClick: function () {
        est = r.estimate; saveDraft(); render(); toast(t('toast.refreshed'));
      } }] });
  }

  /* ================= Settings actions ================= */
  function editModel(id) {
    var m = id ? E.clone(E.findModel(settings, id)) : { id: null, name: '', category: 'Video', credits: 0, perSecond: false, notes: '', archived: false };
    if (!m) return;
    var body = field(t('f.name'), '<input type="text" id="mm-name" value="' + esc(m.name) + '" placeholder="' + esc(t('ph.modelName')) + '">') +
      '<div class="grid">' + field(t('f.category'), selectEl('id="mm-cat"', catOptions(), m.category)) +
      field(t('f.costCredits'), '<input type="text" inputmode="decimal" id="mm-credits" value="' + esc(m.credits) + '">') + '</div>' +
      '<label class="check"><input type="checkbox" id="mm-ps"' + (m.perSecond ? ' checked' : '') + '> ' + esc(t('m.perSecLabel')) + '</label>' +
      field(t('f.notes'), '<textarea id="mm-notes" placeholder="' + esc(t('ph.modelNotes')) + '">' + esc(m.notes) + '</textarea>') +
      (id ? '<div class="hint">' + t('m.modelHint') + '</div>' : '');
    openModal({ title: id ? t('m.editModel') : t('m.addModel'), body: body, actions: [{ label: t('m.cancel'), kind: 'ghost' }, { label: id ? t('btn.save') : t('m.addModel'), kind: 'primary', onClick: function (root) {
      var name = root.querySelector('#mm-name').value.trim();
      if (!name) { root.querySelector('#mm-name').focus(); return false; }
      var data = { name: name, category: root.querySelector('#mm-cat').value, credits: E.num(root.querySelector('#mm-credits').value), perSecond: root.querySelector('#mm-ps').checked, notes: root.querySelector('#mm-notes').value };
      if (id) Object.assign(E.findModel(settings, id), data);
      else settings.models.push(Object.assign({ id: E.uid('m'), archived: false }, data));
      saveSettings(); render(); toast(id ? t('toast.modelUpdated') : t('toast.modelAdded'));
    } }] });
  }

  function exportData() {
    var run = function () {
      var data = { app: 'ai-estimate-calculator', schema: 1, exportedAt: new Date().toISOString(), settings: settings, estimates: estimates };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'estimates-backup-' + E.today() + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast(t('toast.exported', { n: estimates.length }));
    };
    if (isDirty()) confirmDialog(t('m.unsavedTitle'), esc(t('m.unsavedMsg')), t('m.export')).then(function (ok) { if (ok) run(); });
    else run();
  }
  function importData(text) {
    var data;
    try { data = JSON.parse(text); } catch (e) { toast(t('toast.badJson'), 'error'); return; }
    if (!data || typeof data !== 'object' || (!data.settings && !Array.isArray(data.estimates))) { toast(t('toast.badBackup'), 'error'); return; }
    var inEst = Array.isArray(data.estimates) ? data.estimates.map(E.normalizeEstimate) : [];
    var inSet = data.settings ? E.normalizeSettings(data.settings) : null;
    openModal({ title: t('m.importTitle'), body: '<div>' + t('m.importMsg', { n: inEst.length, m: inSet ? inSet.models.length : null }) + '</div><ul>' + t('m.importHelp') + '</ul>',
      actions: [{ label: t('m.cancel'), kind: 'ghost' },
        { label: t('m.importMerge'), onClick: function () {
          if (inSet) inSet.models.forEach(function (m) { if (!E.findModel(settings, m.id)) settings.models.push(m); });
          var added = 0;
          inEst.forEach(function (e) {
            var i = estimates.findIndex(function (x) { return x.id === e.id; });
            if (i < 0) { estimates.push(e); added++; } else if (String(e.updatedAt) > String(estimates[i].updatedAt)) { estimates[i] = e; added++; }
          });
          saveSettings(); saveEstimates(); render(); toast(t('toast.merged', { n: added }));
        } },
        { label: t('m.importReplace'), kind: 'danger solid primary', onClick: function () {
          if (inSet) settings = inSet;
          estimates = inEst;
          saveSettings(); saveEstimates(); render(); toast(t('toast.replaced'));
        } }] });
  }
  /** Reads an uploaded logo, downsizes it (max 600 px) and stores it as a data URL in settings. */
  function setLogoFromFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 600 / Math.max(img.naturalWidth || 600, img.naturalHeight || 600));
        var w = Math.max(1, Math.round((img.naturalWidth || 600) * scale)), h = Math.max(1, Math.round((img.naturalHeight || 600) * scale));
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        settings.studio.logoImage = file.type === 'image/jpeg' ? cv.toDataURL('image/jpeg', 0.9) : cv.toDataURL('image/png');
        settings.studio.logoMode = 'image';
        saveSettings(); render(); toast(t('toast.logoSet'));
      };
      img.onerror = function () { toast(t('toast.logoBad'), 'error'); };
      img.src = String(reader.result);
    };
    reader.readAsDataURL(file);
  }

  /* ================= Events ================= */
  document.getElementById('nav').addEventListener('click', function (e) {
    var b = e.target.closest('[data-nav]'); if (b) go(b.dataset.nav);
  });
  document.getElementById('lang-switch').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang]');
    if (b && b.dataset.lang !== ui.lang) { ui.lang = b.dataset.lang; saveUi(); render(); }
  });
  document.getElementById('import-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { importData(String(r.result)); };
    r.readAsText(f); e.target.value = '';
  });
  document.getElementById('logo-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (f) setLogoFromFile(f);
    e.target.value = '';
  });

  app.addEventListener('input', function (e) {
    var el = e.target;
    if (el.type === 'checkbox' || el.tagName === 'SELECT') return; // handled on change
    if (el.dataset.bind) { setPath(est, el.dataset.bind, readVal(el)); saveDraft(); updateDerived(); }
    else if (el.dataset.sbind) { setPath(settings, el.dataset.sbind, readVal(el)); saveSettings(); }
    else if (el.hasAttribute('data-search')) { ui.search = el.value; $('[data-out="saved-list"]').innerHTML = renderSavedList(); }
  });

  app.addEventListener('change', function (e) {
    var el = e.target, i = +el.dataset.i;
    if (el.dataset.actionCheck === 'toggle-archived') { ui.showArchived = el.checked; saveUi(); render(); return; }
    if (el.dataset.change) {
      var v = el.value;
      if (el.dataset.change === 'line-category') {
        var l = est.lines[i]; l.category = v;
        if (v === 'Video' && !E.num(l.duration)) l.duration = 5;
        E.setLineModel(l, settings, (E.activeModels(settings, v)[0] || {}).id || 'custom');
      } else if (el.dataset.change === 'line-model') {
        E.setLineModel(est.lines[i], settings, v);
      } else if (el.dataset.change === 'usage-option') {
        if (v === 'custom') est.usage = { optionId: 'custom', name: '', type: est.usage.type, value: est.usage.value };
        else { var u = settings.usageOptions.find(function (x) { return x.id === v; }); if (u) est.usage = { optionId: u.id, name: u.name, type: u.type, value: E.num(u.value) }; }
      } else if (el.dataset.change === 'rush-option') {
        if (v === 'custom') est.rush = { optionId: 'custom', name: '', pct: est.rush.pct };
        else { var r = settings.rushOptions.find(function (x) { return x.id === v; }); if (r) est.rush = { optionId: r.id, name: r.name, pct: E.num(r.pct) }; }
      }
      saveDraft(); render(); return;
    }
    if (el.tagName === 'SELECT' || el.type === 'checkbox') {
      if (el.dataset.bind) { setPath(est, el.dataset.bind, readVal(el)); saveDraft(); }
      else if (el.dataset.sbind) { setPath(settings, el.dataset.sbind, readVal(el)); saveSettings(); }
      if (el.hasAttribute('data-rerender')) render(); else if (el.dataset.bind) updateDerived();
    }
  });

  app.addEventListener('click', async function (e) {
    var b = e.target.closest('[data-action]');
    if (!b || !app.contains(b)) return;
    var a = b.dataset.action, i = +b.dataset.i, id = b.dataset.id;
    switch (a) {
      case 'set':
        setPath(b.dataset.scope === 'settings' ? settings : est, b.dataset.path, b.dataset.value);
        if (b.dataset.scope === 'settings') saveSettings(); else saveDraft();
        render(); break;
      case 'new':
        if (!(await guardDiscard())) return;
        est = E.newEstimate(settings); baseJson = JSON.stringify(est); saveDraft(); go('estimate'); window.scrollTo(0, 0); break;
      case 'save': await saveCurrent(); break;
      case 'duplicate-current':
        est = E.duplicateEstimate(est, t('copySuffix')); baseJson = ''; saveDraft(); render(); toast(t('toast.dupCurrent')); break;
      case 'refresh-prices': doRefreshPrices(); break;
      case 'client': go('client'); window.scrollTo(0, 0); break;
      case 'back': go('estimate'); break;
      case 'print': window.print(); break;
      case 'scroll-summary': var s = $('#summary'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'add-line': {
        var last = est.lines[est.lines.length - 1];
        est.lines.push(E.makeLine(settings, b.dataset.cat || (last && last.category) || 'Video'));
        saveDraft(); render();
        var ins = $$('.line .line-top input', app); if (ins.length) ins[ins.length - 1].focus({ preventScroll: true });
        break;
      }
      case 'line-dup': { var cp = E.clone(est.lines[i]); cp.id = E.uid('l'); est.lines.splice(i + 1, 0, cp); saveDraft(); render(); break; }
      case 'line-del': est.lines.splice(i, 1); saveDraft(); render(); break;
      case 'add-service': est.services.push(E.newCustomService(settings)); saveDraft(); render(); break;
      case 'svc-del': est.services.splice(i, 1); saveDraft(); render(); break;
      case 'add-fixed': est.fixedCosts.push({ id: E.uid('f'), name: '', amount: 0 }); saveDraft(); render();
        var fi = $$('.rows .row input', app); if (fi.length >= 2) fi[fi.length - 2].focus({ preventScroll: true }); break;
      case 'fixed-del': est.fixedCosts.splice(i, 1); saveDraft(); render(); break;

      case 'open': {
        if (id === est.id && !isDirty()) { go('estimate'); break; }
        if (!(await guardDiscard())) return;
        var found = estimates.find(function (x) { return x.id === id; });
        if (found) { loadEstimate(found); go('estimate'); window.scrollTo(0, 0); }
        break;
      }
      case 'dup-saved': {
        var src = estimates.find(function (x) { return x.id === id; });
        if (src) { var d = E.duplicateEstimate(src, t('copySuffix')); estimates.unshift(d); saveEstimates(); render(); toast(t('toast.duplicated', { n: d.name })); }
        break;
      }
      case 'del-saved': {
        var del = estimates.find(function (x) { return x.id === id; });
        if (del && await confirmDialog(t('m.delEstTitle'), esc(t('m.delEstMsg', { n: del.name || t('untitled') })), t('btn.delete'), true)) {
          estimates = estimates.filter(function (x) { return x.id !== id; }); saveEstimates(); render(); toast(t('toast.deleted'));
        }
        break;
      }
      case 'export': exportData(); break;
      case 'import': $('#import-file').click(); break;
      case 'logo-upload': $('#logo-file').click(); break;

      case 'model-add': editModel(null); break;
      case 'model-edit': editModel(id); break;
      case 'model-archive': E.findModel(settings, id).archived = true; saveSettings(); render(); toast(t('toast.archived')); break;
      case 'model-restore': E.findModel(settings, id).archived = false; saveSettings(); render(); toast(t('toast.restored')); break;
      case 'model-delete': {
        var m = E.findModel(settings, id);
        if (modelUsage(id)) { toast(t('toast.modelInUse'), 'error'); break; }
        if (await confirmDialog(t('m.delModelTitle'), esc(t('m.delModelMsg', { n: m.name })), t('btn.delete'), true)) {
          settings.models = settings.models.filter(function (x) { return x.id !== id; }); saveSettings(); render();
        }
        break;
      }
      case 'rush-add': settings.rushOptions.push({ id: E.uid('r'), name: '', pct: 0 }); saveSettings(); render(); break;
      case 'rush-del': settings.rushOptions.splice(i, 1); saveSettings(); render(); break;
      case 'usage-add': settings.usageOptions.push({ id: E.uid('u'), name: '', type: 'mult', value: 1 }); saveSettings(); render(); break;
      case 'usage-del': settings.usageOptions.splice(i, 1); saveSettings(); render(); break;
      case 'reset-settings':
        if (await confirmDialog(t('m.resetTitle'), esc(t('m.resetMsg')), t('m.reset'), true)) {
          settings = E.defaultSettings(); saveSettings(); render(); toast(t('toast.reset'));
        }
        break;
      case 'wipe':
        if (await confirmDialog(t('m.wipeTitle'), esc(t('m.wipeMsg')), t('m.wipe'), true)) {
          Object.keys(KEYS).forEach(function (k) { try { localStorage.removeItem(KEYS[k]); } catch (err) { /* ignore */ } });
          location.reload();
        }
        break;
    }
  });

  // Keep data in sync if the app is open in two tabs.
  window.addEventListener('storage', function (e) {
    if (e.key === KEYS.settings) { settings = E.normalizeSettings(load(KEYS.settings, null)); if (ui.view !== 'estimate') render(); }
    if (e.key === KEYS.estimates) { estimates = (load(KEYS.estimates, []) || []).map(E.normalizeEstimate); if (ui.view === 'saved') render(); }
  });

  var icon = document.querySelector('link[rel="icon"]');
  if (icon) { icon.type = 'image/jpeg'; icon.href = CHIEFS_LOGO; }
  if (ui.view === 'estimate') freshenPristine();
  render();
})();
</script>
</body>
</html>
